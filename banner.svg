<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Hi, I'm apriprogram. Fullstack Developer, Web and Mobile.">
  <defs>
    <style>
      @font-face{font-family:'PJS';font-weight:800;src:url(data:font/woff2;base64,) format('woff2');}
      @font-face{font-family:'PJS';font-weight:600;src:url(data:font/woff2;base64,) format('woff2');}
      .title{font-family:'PJS',system-ui,sans-serif;font-weight:800;font-size:68px;letter-spacing:-1.5px;fill:#F8FAFC}
      .sub{font-family:'PJS',system-ui,sans-serif;font-weight:600;font-size:26px;fill:#CBD5E1}
      .tech{font-family:'PJS',system-ui,sans-serif;font-weight:600;font-size:17px;letter-spacing:4px;fill:#7DD3FC}
      .deco{font-family:'PJS',system-ui,sans-serif;font-weight:800;font-size:150px;fill:#FFFFFF;fill-opacity:.045}
      .glow-a{animation:pulse 7s ease-in-out infinite}
      .glow-b{animation:pulse 7s ease-in-out 3.5s infinite}
      @keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
      @media (prefers-reduced-motion: reduce){.glow-a,.glow-b{animation:none}}
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050A18"/>
      <stop offset=".55" stop-color="#0A1633"/>
      <stop offset="1" stop-color="#112B6E"/>
    </linearGradient>
    <radialGradient id="glow-blue">
      <stop offset="0" stop-color="#3B82F6" stop-opacity=".55"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-violet">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity=".45"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-cyan">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".35"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity=".11" stroke-width="1"/>
    </pattern>
    <radialGradient id="grid-fade" cx=".5" cy=".45" r=".65">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <mask id="grid-mask"><rect width="1200" height="320" fill="url(#grid-fade)"/></mask>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="divider" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60A5FA" stop-opacity="0"/>
      <stop offset=".5" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="320" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)" mask="url(#grid-mask)"/>
    <circle class="glow-a" cx="1030" cy="30" r="280" fill="url(#glow-blue)"/>
    <circle class="glow-b" cx="150" cy="310" r="260" fill="url(#glow-violet)"/>
    <circle cx="640" cy="-60" r="200" fill="url(#glow-cyan)"/>
    <text class="deco" x="1150" y="300" text-anchor="end">&lt;/&gt;</text>
    <text class="title" x="600" y="150" text-anchor="middle">Hi, I’m <tspan fill="url(#name)">apriprogram</tspan></text>
    <text class="sub" x="600" y="200" text-anchor="middle">Fullstack Developer · Web &amp; Mobile</text>
    <rect x="540" y="226" width="120" height="2" rx="1" fill="url(#divider)"/>
    <text class="tech" x="600" y="268" text-anchor="middle">NEXT.JS · TYPESCRIPT · REACT NATIVE · LARAVEL · NODE.JS</text>
    <rect x=".5" y=".5" width="1199" height="319" rx="23.5" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>
  </g>
</svg>
